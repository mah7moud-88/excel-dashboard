<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            padding: 20px 16px;
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 24px;
            font-size: 20px;
            font-weight: 600;
        }

        .addin-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 22px;
            margin-bottom: 14px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            color: white;
            text-align: right;
        }

        .addin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
        }

        .addin-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .addin-btn .label {
            flex: 1;
            text-align: right;
            padding-right: 10px;
        }

        .addin-btn .icon {
            font-size: 22px;
            line-height: 1;
        }

        /* الألوان */
        .btn-blue {
            background: #1a73e8;
        }
        .btn-blue:hover {
            background: #1765cc;
        }

        .btn-white {
            background: #ffffff;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        .btn-white:hover {
            background: #fafafa;
            border-color: #c0c0c0;
        }

        .btn-red {
            background: #c62828;
        }
        .btn-red:hover {
            background: #b71c1c;
        }

        .btn-green {
            background: #2e7d32;
        }
        .btn-green:hover {
            background: #1b5e20;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h2>🎛️ لوحة التحكم</h2>

    <!-- الزر 1: Paster Tool -->
    <button class="addin-btn btn-blue"
            onclick="openAddin('https://mahmoudtools.vercel.app/', 'Paster Tool')">
        <span class="label">Paster Tool</span>
        <span class="icon">🔍</span>
    </button>

    <!-- الزر 2: Smart Search -->
    <button class="addin-btn btn-white"
            onclick="openAddin('https://searchtool-sigma.vercel.app/taskpane.html', 'Smart Search')">
        <span class="label">Smart Search</span>
        <span class="icon">📁</span>
    </button>

    <!-- الزر 3: Account Sorter -->
    <button class="addin-btn btn-red"
            onclick="openAddin('https://sorter-tool.vercel.app/taskpane.html', 'Account Sorter')">
        <span class="label">Account Sorter</span>
        <span class="icon">🗑️</span>
    </button>

    <!-- الزر 4: Smart Search 2 -->
    <button class="addin-btn btn-green"
            onclick="openAddin('https://searchtool2.vercel.app/taskpane.html', 'Smart Search 2')">
        <span class="label">Smart Search 2</span>
        <span class="icon">📤</span>
    </button>

    <div class="footer">Excel Dashboard v1.0</div>

    <script>
        // تهيئة Office.js
        Office.onReady(function (info) {
            console.log("Dashboard ready:", info);
        });

        /**
         * فتح إضافة في نافذة Dialog
         * @param {string} url - رابط الإضافة
         * @param {string} title - اسم الإضافة (للعرض)
         */
        function openAddin(url, title) {
            // محاولة فتح الإضافة في Dialog
            Office.context.ui.displayDialogAsync(
                url,
                {
                    height: 90,       // 90% من ارتفاع الشاشة
                    width: 90,        // 90% من عرض الشاشة
                    displayInIframe: true,
                    promptBeforeOpen: false
                },
                function (asyncResult) {
                    if (asyncResult.status === Office.AsyncResultStatus.Failed) {
                        console.error("فشل فتح " + title + ": " + asyncResult.error.message);
                        
                        // حل بديل: افتح في تاب جديد
                        window.open(url, '_blank');
                    } else {
                        // تم فتح الـ Dialog بنجاح
                        console.log(title + " opened successfully");
                        
                        var dialog = asyncResult.value;
                        
                        // معالجة رسائل من الـ Dialog (لو حبيت لاحقاً)
                        dialog.addEventHandler(Office.EventType.DialogMessageReceived, function (arg) {
                            console.log("Message from dialog:", arg.message);
                        });
                        
                        // معالجة إغلاق الـ Dialog
                        dialog.addEventHandler(Office.EventType.DialogEventReceived, function (arg) {
                            console.log("Dialog closed");
                        });
                    }
                }
            );
        }
    </script>

</body>
</html>
